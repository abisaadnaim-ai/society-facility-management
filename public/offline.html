<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline — Society FM</title>
<style>
  :root { --brand:#DD7927; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#f8fafc; color:#0f172a; font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:24px; }
  .card { max-width:360px; text-align:center; }
  img { width:88px; height:88px; }
  h1 { font-size:1.125rem; margin:20px 0 6px; }
  p { color:#475569; font-size:.9rem; line-height:1.5; margin:0 0 20px; }
  button { background:var(--brand); color:#fff; border:0; border-radius:10px; padding:12px 20px;
    font-size:.95rem; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="Society FM" />
    <h1>You're offline</h1>
    <p>Society FM needs a connection to load live operational data. Please reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
